<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Material - {{ curso.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .upload-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .btn-custom {
            min-width: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="upload-container">
            <h2 class="mb-4"><i class="bi bi-upload"></i> Subir Material</h2>
            
            <a href="{% url 'ver_contenido_curso' curso.id %}" class="btn btn-outline-secondary mb-4">
                <i class="bi bi-arrow-left"></i> Volver al curso
            </a>

            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}

            <form method="post" enctype="multipart/form-data" class="mt-4">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Título *</label>
                    <input type="text" name="titulo" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Semana *</label>
                    <select name="semana" class="form-select" required>
                        <option value="">Selecciona una semana</option>
                        {% for i in "12345678910111213141516"|make_list %}
                            <option value="{{ i }}">Semana {{ i }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Archivo (opcional)</label>
                    <input type="file" name="archivo" class="form-control">
                    <div class="form-text">Sube un archivo (PDF, Word, PowerPoint, etc.)</div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">O enlace (opcional)</label>
                    <input type="url" name="enlace" class="form-control" placeholder="https://ejemplo.com">
                    <div class="form-text">O proporciona un enlace a un recurso en línea</div>
                </div>
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-primary btn-custom">
                        <i class="bi bi-upload"></i> Subir Material
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Validación simple del formulario
        document.querySelector('form').addEventListener('submit', function(e) {
            const titulo = this.querySelector('[name="titulo"]').value.trim();
            const semana = this.querySelector('[name="semana"]').value;
            const archivo = this.querySelector('[name="archivo"]').files[0];
            const enlace = this.querySelector('[name="enlace"]').value.trim();
            
            if (!titulo) {
                alert('Por favor ingresa un título');
                e.preventDefault();
                return false;
            }
            
            if (!semana) {
                alert('Por favor selecciona una semana');
                e.preventDefault();
                return false;
            }
            
            if (!archivo && !enlace) {
                alert('Debes subir un archivo o proporcionar un enlace');
                e.preventDefault();
                return false;
            }
            
            return true;
        });
    </script>
</body>
</html>
