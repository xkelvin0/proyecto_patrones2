{% extends 'matriculas/base.html' %}

{% block title %}Iniciar Sesión - Sistema de Matrículas{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Iniciar Sesión</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Nombre de usuario</label>
                        <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                        </button>
                    </div>
                </form>
                
                <div class="mt-3 text-center">
                    <p class="mb-1">¿No tienes una cuenta?</p>
                    <div class="btn-group" role="group">
                        <a href="{% url 'registro_estudiante' %}" class="btn btn-outline-primary btn-sm">
                            Registrarse como Estudiante
                        </a>
                        <a href="{% url 'registro_profesor' %}" class="btn btn-outline-success btn-sm">
                            Registrarse como Profesor
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Agregar clases de Bootstrap a los campos del formulario
    document.addEventListener('DOMContentLoaded', function() {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.classList.add('form-control');
        });
    });
</script>
{% endblock %}
